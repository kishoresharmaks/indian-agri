<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 85" width="120" height="85">
  <defs>
    <linearGradient id="gold9001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B820"/>
      <stop offset="40%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#C89818"/>
    </linearGradient>
  </defs>

  <!-- Main oval badge background -->
  <rect x="3" y="3" width="114" height="79" rx="14" fill="#0b1e0f"/>

  <!-- Gold outer border -->
  <rect x="3" y="3" width="114" height="79" rx="14" fill="none" stroke="url(#gold9001)" stroke-width="2.2"/>

  <!-- Inner thin border -->
  <rect x="8" y="8" width="104" height="69" rx="10" fill="none" stroke="#D4A017" stroke-width="0.6" opacity="0.35"/>

  <!-- ISO letters - bold, spaced -->
  <text x="60" y="27" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="900" fill="url(#gold9001)" text-anchor="middle" letter-spacing="4">ISO</text>

  <!-- 9001 in large bold white -->
  <text x="60" y="52" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">9001</text>

  <!-- Thin gold divider -->
  <line x1="30" y1="58" x2="90" y2="58" stroke="#D4A017" stroke-width="0.8" opacity="0.7"/>

  <!-- Quality Management - split into two lines for better fit -->
  <text x="60" y="68" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#B0CCB6" text-anchor="middle" letter-spacing="1.2">QUALITY</text>
  <text x="60" y="77" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#B0CCB6" text-anchor="middle" letter-spacing="1.2">MANAGEMENT</text>

  <!-- Small year stamp -->
  <text x="60" y="83" font-family="Arial, Helvetica, sans-serif" font-size="5.5" fill="#6d8a73" text-anchor="middle" letter-spacing="0.8">2015</text>
</svg>
