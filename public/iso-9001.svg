<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <linearGradient id="isoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="50%" style="stop-color:#F5C842"/>
      <stop offset="100%" style="stop-color:#D4A017"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="116" height="76" rx="6" fill="#0e2413" stroke="url(#isoGold)" stroke-width="2"/>
  <!-- ISO Text -->
  <text x="60" y="22" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="url(#isoGold)" text-anchor="middle">ISO</text>
  <!-- 9001 -->
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">9001</text>
  <!-- Quality Management text -->
  <text x="60" y="54" font-family="Arial, sans-serif" font-size="7" fill="#a0cfa7" text-anchor="middle">QUALITY</text>
  <text x="60" y="63" font-family="Arial, sans-serif" font-size="7" fill="#a0cfa7" text-anchor="middle">MANAGEMENT</text>
  <!-- Year -->
  <text x="60" y="73" font-family="Arial, sans-serif" font-size="6" fill="#9eb8a2" text-anchor="middle">2015</text>
</svg>